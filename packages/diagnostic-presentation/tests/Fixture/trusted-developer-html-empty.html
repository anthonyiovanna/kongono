<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>KGN-KERNEL-1001 — Kernel boot failed — Kongono diagnostic</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f3f5f8;
      --surface: #ffffff;
      --surface-muted: #f7f8fb;
      --text: #172033;
      --muted: #526079;
      --border: #d8dee9;
      --accent: #3157d5;
      --accent-strong: #203fa7;
      --code: #eef2ff;
      --shadow: 0 1.125rem 3.125rem rgba(31, 42, 68, 0.14);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      line-height: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #192231;
        --surface-muted: #202b3d;
        --text: #f4f7fb;
        --muted: #b9c4d5;
        --border: #3b4960;
        --accent: #9cb4ff;
        --accent-strong: #c7d4ff;
        --code: #273653;
        --shadow: 0 1.125rem 3.125rem rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      color: var(--text);
    }

    .skip-link {
      position: absolute;
      z-index: 1;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.625rem 0.875rem;
      transform: translateY(-200%);
      border-radius: 0.375rem;
      background: var(--accent-strong);
      color: var(--surface);
      font-weight: 700;
    }

    .skip-link:focus {
      transform: none;
      outline: 0.1875rem solid currentColor;
      outline-offset: 0.1875rem;
    }

    main {
      width: min(calc(100% - 2rem), 64rem);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 4rem) 0;
    }

    .diagnostic-card {
      overflow: hidden;
      border: 0.0625rem solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .diagnostic-header,
    .diagnostic-section {
      padding: clamp(1.25rem, 4vw, 2.5rem);
    }

    .diagnostic-header,
    .diagnostic-section:not(:last-child) {
      border-bottom: 0.0625rem solid var(--border);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--accent-strong);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .identity {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem 1rem;
      align-items: center;
    }

    .identifier {
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      background: var(--code);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.875rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .owner {
      margin: 0;
      color: var(--muted);
      font-size: 0.9375rem;
    }

    .owner span {
      color: var(--text);
      font-weight: 700;
    }

    h1,
    h2,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      max-width: 24ch;
      margin: 1rem 0 0;
      font-size: clamp(1.75rem, 5vw, 3rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.125rem, 3vw, 1.375rem);
      line-height: 1.25;
    }

    .detail,
    .empty-context {
      max-width: 75ch;
      margin: 0;
      color: var(--text);
    }

    .fields {
      display: grid;
      gap: 0.875rem;
      margin: 0;
    }

    .context-item {
      overflow: hidden;
      border: 0.0625rem solid var(--border);
      border-radius: 0.75rem;
      background: var(--surface-muted);
    }

    .context-item dt {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.875rem;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.875rem 1rem;
    }

    .field-label {
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .field-key {
      color: var(--muted);
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    .context-item dd {
      margin: 0;
      padding: 1rem;
      border-top: 0.0625rem solid var(--border);
    }

    .field-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .meta-item {
      padding: 0.1875rem 0.5rem;
      border: 0.0625rem solid var(--border);
      border-radius: 999rem;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .field-value {
      margin: 0;
      padding: 0.875rem;
      border: 0.0625rem solid var(--border);
      border-radius: 0.5rem;
      background: var(--code);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 36rem) {
      main {
        width: min(calc(100% - 1rem), 64rem);
        padding: 0.5rem 0;
      }

      .diagnostic-card {
        border-radius: 0.75rem;
      }

      .context-item dt {
        display: block;
      }

      .field-key {
        display: block;
        margin-top: 0.375rem;
      }
    }

    @media (forced-colors: active) {
      .diagnostic-card,
      .context-item,
      .context-item dd,
      .field-value,
      .meta-item {
        border-color: CanvasText;
      }

      .skip-link:focus {
        outline-color: Highlight;
      }
    }

    @media print {
      :root {
        color-scheme: light;
        --page: #ffffff;
        --surface: #ffffff;
        --surface-muted: #ffffff;
        --text: #000000;
        --muted: #333333;
        --border: #777777;
        --code: #ffffff;
        --shadow: none;
      }

      body {
        min-height: 0;
      }

      main {
        width: 100%;
        padding: 0;
      }

      .skip-link {
        display: none;
      }

      .diagnostic-card {
        box-shadow: none;
      }

      .context-item {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#diagnostic-main">Skip to diagnostic</a>
  <main id="diagnostic-main">
    <article class="diagnostic-card">
      <header class="diagnostic-header">
        <p class="eyebrow">Kongono diagnostic</p>
        <div class="identity">
          <code class="identifier">KGN-KERNEL-1001</code>
          <p class="owner">Owner: <span>Kernel</span></p>
        </div>
        <h1>Kernel boot failed</h1>
      </header>
      <section class="diagnostic-section">
        <h2>What happened</h2>
        <p class="detail">Boot kernel</p>
      </section>
      <section class="diagnostic-section">
        <h2>Why it happened</h2>
        <p class="detail">Kernel state must be cold</p>
      </section>
      <section class="diagnostic-section">
        <h2>Context</h2>
        <p class="empty-context">No additional diagnostic context was captured.</p>
      </section>
      <section class="diagnostic-section">
        <h2>How to fix it</h2>
        <p class="detail">Create one fresh kernel instance.</p>
      </section>
    </article>
  </main>
</body>
</html>
