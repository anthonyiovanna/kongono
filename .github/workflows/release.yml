name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring, openssl, pdo, pdo_pgsql, sodium, zlib
          tools: composer:v2

      - name: Install Dependencies & Verify Suite
        run: |
          composer install --no-interaction --prefer-dist
          composer validate --no-check-publish --strict
          composer cs
          composer analyse
          php -d memory_limit=512M vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-deprecation --fail-on-warning --fail-on-notice

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "Kongono Framework ${{ github.ref_name }}"
