name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Verify, Attest (SLSA + SBOM) & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          extensions: curl, dom, json, mbstring, openssl, pdo, pdo_pgsql, sodium, zlib
          ini-values: session.upload_progress.enabled=Off, zend.exception_ignore_args=On, expose_php=Off
          tools: composer:v2

      - name: Install Dependencies & Run Full Security Gate
        run: |
          composer install --no-interaction --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --abandoned=report
          composer cs
          composer analyse
          php -d memory_limit=512M vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-deprecation --fail-on-warning --fail-on-notice
          KONGONO_FUZZ_ITERATIONS=600 composer fuzz
          php bin/kongo prove --app=examples/starter-app
          php bin/kongo audit --attack --strict --app=examples/starter-app
          php bin/kongo eval --redteam --app=examples/starter-app
          php bin/kongo eval --companions --app=examples/starter-app

      - name: Build Release Archive, CycloneDX 1.5 SBOM & SHA-256 Checksums
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag format: $REF_NAME" >&2
            exit 1
          fi
          mkdir -p dist
          git archive --format=tar.gz --prefix="kongono-${REF_NAME}/" -o "dist/kongono-${REF_NAME}.tar.gz" HEAD
          php bin/generate-sbom "$REF_NAME" "dist/kongono-${REF_NAME}.cdx.json"
          (cd dist && sha256sum "kongono-${REF_NAME}.tar.gz" "kongono-${REF_NAME}.cdx.json" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Generate SLSA Build Provenance Attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kongono-*.tar.gz
            dist/kongono-*.cdx.json

      - name: Create GitHub Release with Verified Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            "dist/kongono-${REF_NAME}.tar.gz" \
            "dist/kongono-${REF_NAME}.cdx.json" \
            "dist/SHA256SUMS.txt" \
            --generate-notes \
            --title "Kongono Framework $REF_NAME"

  publish-openvsx:
    name: Publish VS Code Extension to Open VSX (OIDC Trusted Publisher)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify Extension Version Matches Release Tag & Publish via OIDC
        working-directory: editors/vscode-kongono
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Skipping Open VSX publish: editors/vscode-kongono/package.json version ($PKG_VERSION) != tag ($TAG_VERSION)."
            exit 0
          fi
          npx --yes ovsx publish --trusted-publishing
